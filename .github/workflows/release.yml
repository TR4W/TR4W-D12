# .github/workflows/release.yml
#
# Triggers:
#   1. Tag push vX.Y.Z       -> build + installer + draft release
#   2. Manual (Actions UI)   -> build + installer, no release
#
# Pipeline (TR4W is Windows-only; ALL jobs run on the self-hosted
# [self-hosted, win-ci] lab runner -- nothing runs on GitHub-hosted servers):
#   build (win-ci)           -> FullBuild.ps1: lints, unit tests, app, server,
#                               NSIS installer; upload installer artifact
#   virustotal-scan (win-ci) -> download installer, scan via VT API, produce
#                               virustotal-report.md, upload as artifact
#   release (win-ci)         -> only on tag push; download both artifacts,
#                               create a draft release with each attached
#
# Single source of truth = tr4w/src/Version.pas; FullBuild passes /DTR4WVERSION
# to NSIS and then VERIFIES the linked tr4w.exe reports that version, so a
# resource that failed to link cannot ship silently.
#
# ---------------------------------------------------------------------------
# PORTED TO FREEPASCAL, 2026-08-13. What changed and why:
#
#   * No RAD Studio. The toolchain is FPC + the Lazarus LCL. There is no
#     rsvars.bat, no msbuild and no brcc32 -- the version resource is compiled
#     with fpcres, because windres needs a C preprocessor (cc1) that the FPC
#     distribution does not ship.
#
#   * No language matrix. TR4W builds ONE English binary and is moving to
#     resourcestrings for I18N (NY4I, 2026-08-13). The '-all' tag suffix, the
#     all_languages input, the parallel-worktree language build and the
#     per-language artifact naming are all gone. A tag ending in '-all' still
#     validates (the suffix is stripped) but produces the same single build.
#
#   * Toolchain paths are DISCOVERED, not configured. tr4w/build/Find-Toolchain.ps1
#     locates FPC and Lazarus and verifies what actually matters: a compiler
#     that can TARGET i386-win32 (fpc.exe is only a driver -- the backend is
#     ppc386/ppcross386), an i386 RTL, and i386 LCL units. FPC_HOME and
#     LAZARUS_DIR below pin it explicitly, which is what you want on CI.
#
#   * The lints now run as part of the build. They used to live in
#     tr4w.lproj's PreBuildEvent, so msbuild ran them and nothing else did;
#     FullBuild.ps1 invokes build/Run-Lints.ps1 explicitly.
#
# Runner setup (one-time on the self-hosted win-ci runner):
#   - FPC able to target i386-win32 (fpc.exe + ppc386/ppcross386 + i386 RTL).
#     Pin with repo variable FPC_HOME (the directory holding fpc.exe).
#   - Lazarus WITH LCL units for i386-win32. An x86_64-only install -- the
#     fpcupdeluxe default -- CANNOT build TR4W. Pin with LAZARUS_DIR.
#   - NSIS (makensis.exe) -- default C:\Program Files (x86)\NSIS. Pin with NSIS_BIN.
#   - Indy 10 is bundled in tr4w\include; nothing to install.
#
# Secrets required:
#   - VIRUS_TOTAL_API_KEY  -- VT public API key (free tier is fine for this
#                             release cadence).
#   - APPLE_API_KEY_P8     -- base64 of the App Store Connect API key (.p8),
#                             used by notarytool on mac-ci.
#   - APPLE_API_KEY_ID     -- that key's id.
#   - APPLE_API_ISSUER_ID  -- the issuer UUID.
#
# THERE IS NO CERTIFICATE SECRET AND THERE MUST NOT BE. The Developer ID
# Application certificate and its private key live in mac-ci's own keychain
# (verified 2026-09-20: one valid codesigning identity, usable unprompted by
# the runner user). A certificate exported into a repository secret is a
# signing key that every workflow run, and anyone who can add a workflow, can
# use -- and it cannot be revoked without reissuing. Keeping it on the machine
# means the worst a bad workflow can do is ask THAT machine to sign.
#
# ---------------------------------------------------------------------------
# THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT SHA, with the release tag in a
# trailing comment. Every job here runs on a SELF-HOSTED runner -- the same
# machines that hold the Developer ID key and the lab's radios -- so an action
# runs beside things a GitHub-hosted throwaway VM does not have.
#
# NY4I reviews every pull request, so the risk a review already covers is a
# change to this file. What a review CANNOT catch is a mutable tag being moved
# by a compromised action account: `actions/checkout@v5` is a pointer, and
# repointing it changes what executes on mac-ci without changing a byte here.
# A 40-character SHA is not repointable.
#
# The tag in each comment was verified against the SHA, not assumed
# (2026-09-20, `gh api repos/<owner>/<repo>/git/refs/tags`): each major tag and
# the precise release tag beside it resolve to the SAME commit.
#
# To update one, resolve the new tag to its SHA the same way and replace both
# the SHA and the comment. Do NOT replace the SHA and leave the comment.

name: Release Build

on:
  push:
    tags:
      # Deliberately MAJOR-AGNOSTIC. This read 'v4.*.*' until 2026-08-10, when
      # the version went to 5.0.0 -- a v5.0.0 tag matched nothing and would have
      # run NO release build and NO VirusTotal scan, silently, because a tag
      # that matches no trigger is not an error.
      - 'v[0-9]*.*.*'
  workflow_dispatch:
    inputs:
      skip_virustotal:
        description: 'Skip VirusTotal scan (emergency releases only).'
        type: boolean
        default: false

concurrency:
  group: tr4w-release-${{ github.ref }}
  cancel-in-progress: false

# Needed so softprops/action-gh-release can create draft releases.
permissions:
  contents: write

env:
  # Toolchain locations. Override via repo Settings -> Variables -> Actions to
  # pin non-default installs without editing this file. Left EMPTY by default:
  # Find-Toolchain.ps1 discovers the toolchain and reports every path it tried
  # when it cannot, which is more useful than a wrong hardcoded default.
  FPC_HOME:    ${{ vars.FPC_HOME    || '' }}
  LAZARUS_DIR: ${{ vars.LAZARUS_DIR || '' }}
  NSIS_BIN:    ${{ vars.NSIS_BIN    || 'C:\Program Files (x86)\NSIS' }}
  # VirusTotal: max malicious detections before blocking the release.
  # TR4W's NSIS installer + bundled inpout32.dll consistently trips ~7 engines
  # on an unsigned build:
  #   - 4-5 ML black-box engines (APEX, Trapmine, Cylance, Defender Wacatac.B!ml,
  #     Xcitium MUPX.Gen) -- pure heuristic on the "unsigned PE" shape
  #   - 1 generic heuristic (VBA32 BScope)
  #   - 1 true positive: DrWeb flags inpout32.dll as a known vulnerable driver
  #     (correct -- inpout32 IS a privilege-escalation primitive; TR4W ships it
  #     for legitimate LPT-port CW keying)
  # Threshold 8 = baseline 7 + 1 for engine churn. Tighten once code-signing is
  # in place, since signed PEs eliminate most of the ML noise.
  VT_MALICIOUS_THRESHOLD: '8'

jobs:
  build:
    name: Build TR4W installer
    runs-on: [self-hosted, win-ci]
    timeout-minutes: 30

    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Extract version from src/Version.pas
        id: ver
        shell: powershell
        run: |
          $line = Select-String -Path "$env:GITHUB_WORKSPACE\tr4w\src\Version.pas" `
                                -Pattern "TR4W_CURRENTVERSION_NUMBER\s*=\s*'([^']+)'" `
                                | Select-Object -First 1
          if (-not $line) {
            throw "Could not extract TR4W_CURRENTVERSION_NUMBER from tr4w/src/Version.pas"
          }
          $version = $line.Matches[0].Groups[1].Value
          Write-Host "Extracted version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate tag matches Version.pas
        if: github.event_name == 'push'
        shell: powershell
        run: |
          # Strip leading 'v' and a trailing '-all'. The '-all' suffix no longer
          # selects a different build -- there is only one -- but tolerating it
          # means an old-habit tag still releases instead of failing obscurely.
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', '' -replace '-all$', ''
          $version = "${{ steps.ver.outputs.version }}"
          if ($tag -ne $version) {
            throw "Tag mismatch: refs/tags/v$tag does not match Version.pas ($version). Bump one or the other before re-tagging."
          }
          Write-Host "Tag v$tag matches Version.pas $version - OK"

      - name: Verify toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Ask the SAME resolver the build uses, so this step cannot pass while
          # the build then fails to find a compiler -- and so its failure output
          # lists every location tried.
          . "$env:GITHUB_WORKSPACE\tr4w\build\Find-Toolchain.ps1"
          $tc = Find-Tr4wToolchain -Fpc $env:FPC_HOME -Laz $env:LAZARUS_DIR
          if (-not $tc) {
            throw "No FPC + Lazarus able to target i386-win32. Set repo variables FPC_HOME / LAZARUS_DIR."
          }

          $makensis = Join-Path $env:NSIS_BIN 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            throw "NSIS not found at $makensis. Set repo variable NSIS_BIN."
          }
          Write-Host "  makensis : $makensis"

      # ---------------------------------------------------------------
      # ONE packaging path. FullBuild.ps1 runs the lints, builds and RUNS the
      # unit tests (a failing test aborts before any binary is produced),
      # builds the app and tr4wserver, and drives NSIS. Nothing here duplicates
      # any of that -- if the release build and a developer build can diverge,
      # they eventually will.
      # ---------------------------------------------------------------
      - name: Build (FullBuild.ps1)
        shell: powershell
        working-directory: ${{ github.workspace }}\tr4w
        run: |
          .\FullBuild.ps1 -BuildInstaller
          if ($LASTEXITCODE -ne 0) { throw "FullBuild.ps1 failed with exit code $LASTEXITCODE" }

      - name: Locate installer
        id: artifact
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'tr4w\build\release'
          if (-not (Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }
          $version = "${{ steps.ver.outputs.version }}"
          # Match THIS version explicitly. A wildcard would happily pick up a
          # stale installer from an earlier version left in the directory and
          # ship it under the new tag.
          $installer = Get-ChildItem $releaseDir -Filter "tr4w_setup_$version.exe" -File |
                       Select-Object -First 1
          if (-not $installer) {
            Write-Host "Contents of ${releaseDir}:"
            Get-ChildItem $releaseDir -File | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "No installer named tr4w_setup_$version.exe in $releaseDir"
          }
          Write-Host "Found $($installer.Name) ($($installer.Length) bytes)"
          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tr4w-installer-${{ steps.ver.outputs.version }}
          path: ${{ steps.artifact.outputs.release_dir }}\tr4w_setup_${{ steps.ver.outputs.version }}.exe
          retention-days: 90
          if-no-files-found: error

  # =================================================================
  # Linux and macOS, on their own self-hosted runners.
  #
  # NEITHER BLOCKS THE WINDOWS RELEASE, and that is a deliberate ruling
  # (NY4I, 2026-09-17): Windows is the shipping platform, and README.md's
  # own framing is that the Unix builds are "builds, not releases". So these
  # are continue-on-error and are NOT in the release job's `needs:` -- their
  # artifacts are attached when they exist and silently absent when they do
  # not. A Unix failure must never withhold an installer.
  #
  # That is also why `fail_on_unmatched_files` is false on the release step
  # below: with these jobs non-blocking, a missing tarball is an expected
  # state rather than an error.
  #
  # build-unix.sh does NOT stop at the first failing stage -- it reports each
  # one so the summary is a ranked worklist -- so a failing unit-test stage
  # still leaves a usable app, server and tarball behind. Both platforms
  # currently fail exactly one test (the DX-cluster segment test, a 150 ms
  # gap against a 250 ms ReadTimeout), which is a margin rather than a
  # portability defect and reproduces on both.
  # =================================================================
  build-linux:
    name: Linux (x86_64)
    runs-on: [self-hosted, linux-ci]
    timeout-minutes: 45
    continue-on-error: true
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A MISSING DISPLAY IS NOT A TEST RESULT, AND IT FAILS HERE RATHER THAN
      # LOOKING LIKE ONE TWENTY MINUTES LATER.
      #
      # The unit-test binary LINKS THE LCL, so gtk2 opens a display during unit
      # initialisation -- before a single assertion -- and on a headless box it
      # aborts with "cannot open display" and exit 1. build-unix.sh recorded
      # that as "FAIL unit tests (run) exit 1", which is the shape that gets
      # dismissed as the known flaky suite.
      #
      # THE WRAPPING NOW LIVES IN build-unix.sh's TEST STAGE, not here. That
      # stage is the one that knows why a display is needed, so it is right for
      # a developer over ssh as well as for CI, and this job cannot forget it.
      # What is left here is the only part CI can usefully add: fail FAST, with
      # a sentence naming the package, if the tool is not installed at all.
      - name: Preflight -- xvfb must be installed
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run is not installed on this runner, so the unit-test stage cannot run at all. Install it (sudo apt install xvfb). This is a MISSING DISPLAY, not a failing test."
            exit 1
          fi
          echo "xvfb-run: $(command -v xvfb-run)"

      - name: Build (build-unix.sh)
        shell: bash
        run: |
          # `|| true` is deliberate: build-unix.sh does not stop at the first
          # failing stage, and the known test failures must not withhold the
          # artifacts. The steps below decide what is publishable by looking at
          # the FILES, which is the only thing a release can attach.
          #
          # ONE INVOCATION, and the AppImage is a stage inside it. Running
          # `--package` or `--appimage` as a separate step would put the
          # ordering in YAML instead of in the script, and a separate
          # invocation is exactly the shape that used to fail: stage_package
          # guarded on a shell variable set by stage_app IN THE SAME PROCESS,
          # so a second run reported "there is no application binary to
          # package" with the binary sitting on disk.
          sh tr4w/build/build-unix.sh || true

      - name: Locate tarball
        id: artifact
        shell: bash
        run: |
          set -e
          # THIS version explicitly. A wildcard would happily pick up a stale
          # tarball from an earlier version and ship it under the new tag --
          # the same reasoning as the Windows 'Locate installer' step.
          f="build-out/dist/tr4w-${{ needs.build.outputs.version }}-x86_64-linux.tar.gz"
          if [ ! -f "$f" ]; then
            echo "::warning::no tarball at $f -- the Linux artifact will be absent from this release"
            ls -la build-out/dist 2>/dev/null || true
            exit 1
          fi
          echo "found $f ($(stat -c%s "$f") bytes)"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tr4w-linux-${{ needs.build.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 90
          if-no-files-found: error

      # ---------------------------------------------------------------
      # THE AppImage, AS ITS OWN ARTIFACT AND AFTER THE TARBALL.
      #
      # THE ORDER IS THE POINT. The tarball is uploaded first and is already
      # safe by the time these two steps run, so a broken AppImage costs the
      # release its AppImage and nothing else -- while still turning this job
      # red, which is what "no broken artifact ships silently" means here. Put
      # the two in one upload and a missing AppImage would take the tarball
      # with it.
      #
      # A SEPARATE ARTIFACT NAME for the same reason: the release job downloads
      # each optionally, so one absent artifact cannot hide the other.
      #
      # This job stays continue-on-error and outside the release job's needs:
      # (NY4I, 2026-09-17), so red here withholds nothing from Windows.
      # ---------------------------------------------------------------
      - name: Locate AppImage
        id: appimage
        shell: bash
        run: |
          set -e
          f="build-out/dist/TR4W-${{ needs.build.outputs.version }}-x86_64.AppImage"
          if [ ! -f "$f" ]; then
            echo "::error::no AppImage at $f -- the AppImage stage did not produce one. It is absent from this release; the tarball above is unaffected."
            ls -la build-out/dist 2>/dev/null || true
            exit 1
          fi
          # A TYPE-2 AppImage IS AN ELF with the magic bytes 'AI' + 0x02 at
          # offset 8. Checked because the one way to ship a broken AppImage is
          # to ship something that is not one: a truncated write, or an HTML
          # error page saved under the right name, both pass a -f test.
          magic=$(dd if="$f" bs=1 skip=8 count=3 2>/dev/null | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "414902" ]; then
            echo "::error::$f is not a type-2 AppImage (bytes 8..10 are 0x$magic, expected 0x414902)"
            exit 1
          fi
          echo "found $f ($(stat -c%s "$f") bytes), type-2 magic OK"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tr4w-linux-appimage-${{ needs.build.outputs.version }}
          path: ${{ steps.appimage.outputs.path }}
          retention-days: 90
          if-no-files-found: error

  build-macos:
    name: macOS (aarch64)
    runs-on: [self-hosted, mac-ci]
    timeout-minutes: 45
    continue-on-error: true
    needs: build

    env:
      # PIN BOTH, TO THE SAME INSTALL. Unpinned, build-unix.sh chooses FPC and
      # Lazarus independently and can pair one install's compiler with
      # another's LCL -- the mismatched-RTL failure that reports
      # "Can't find unit LCLIntf" for a unit that is plainly there, and which
      # had this box misdiagnosed as unprovisioned for a week.
      FPC_HOME: /Users/toms/fpcupdeluxe/fpc/bin/aarch64-darwin/fpc
      LAZARUS_DIR: /Users/toms/fpcupdeluxe/lazarus

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Preflight -- the cocoa widgetset must exist
        shell: bash
        run: |
          # FAILS WITH THE REAL REASON. Without this the build dies much later
          # on "Can't find unit Interfaces", which names the symptom and not
          # the cause: interfaces.ppu lives INSIDE each widgetset directory.
          #
          # And this is not hypothetical -- an fpcupdeluxe UPDATE deleted the
          # cocoa LCL on 2026-09-14 from a box that had shipped an artifact
          # the week before, leaving nogui only.
          ws="$LAZARUS_DIR/lcl/units/aarch64-darwin"
          if [ ! -f "$ws/cocoa/interfaces.ppu" ]; then
            echo "::error::cocoa widgetset missing under $ws (found: $(ls "$ws" 2>/dev/null | tr '\n' ' '))"
            echo "Rebuild it on that machine with:"
            echo "  cd \$HOME/fpcupdeluxe/lazarus && make lcl LCL_PLATFORM=cocoa \\"
            echo "       PP=\$HOME/fpcupdeluxe/fpc/bin/aarch64-darwin/fpc CPU_TARGET=aarch64 OS_TARGET=darwin"
            exit 1
          fi
          echo "cocoa widgetset present"

      # ---------------------------------------------------------------
      # THE NOTARY KEY: DECODED OUTSIDE THE WORKSPACE, AND REMOVED AFTERWARDS.
      #
      # $RUNNER_TEMP, not _work: the workspace is checked out, cleaned and
      # archived by other steps, and a private key sitting in it is one glob
      # away from being uploaded as an artifact. RUNNER_TEMP is outside every
      # path this workflow packages.
      #
      # The name carries the run AND the attempt so two runs cannot collide,
      # and the removal step below globs the pattern so a key left by a job
      # that was cancelled before its cleanup ran is swept as well.
      #
      # Nothing here echoes the key. The only check made on it is a SHAPE
      # check on its first line -- enough to turn "the secret is not base64"
      # or "somebody pasted the .p8 without encoding it" into a clear failure
      # here instead of an opaque notarytool error later.
      # ---------------------------------------------------------------
      - name: Stage the notary API key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "::error::secret APPLE_API_KEY_P8 is not set. Refusing to build a macOS artifact that cannot be notarized -- an unsigned bundle must never ship silently."
            exit 1
          fi
          key="$RUNNER_TEMP/tr4w-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          if ! head -1 "$key" | grep -q 'BEGIN PRIVATE KEY'; then
            rm -f "$key"
            echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key. It should be the base64 of the AuthKey_*.p8 file, whole."
            exit 1
          fi
          echo "TR4W_NOTARY_KEY=$key" >> "$GITHUB_ENV"
          echo "notary key staged at $key ($(stat -f%z "$key") bytes)"

      - name: Build, sign and notarize (build-unix.sh)
        shell: bash
        env:
          # SIGNING IS MANDATORY ON CI. build-unix.sh treats this as
          # fail-closed: with it set, a missing credential or a rejected
          # submission produces NO tarball and NO disk image, rather than
          # unsigned ones. See the packaging stage in that script for why the
          # signing happens THERE and not in a step after this one.
          TR4W_MAC_SIGN: '1'
          # BY FULL NAME, never `security find-identity | head -1`. A second
          # identity in the keychain -- an Apple Development certificate, say
          # -- would silently take the slot, and Gatekeeper does not accept
          # those for distribution. mac-sign.sh additionally requires the name
          # to match exactly one identity.
          # QUOTED, and it has to be: the identity contains ": ", which YAML
          # reads as a mapping separator in a bare scalar.
          TR4W_SIGN_IDENTITY: "${{ vars.MACOS_SIGN_IDENTITY || 'Developer ID Application: Thomas Schaefer (N3397MADHZ)' }}"
          # Straight from the secrets to the process environment; neither is
          # written to $GITHUB_ENV, so neither lands in a file on the runner.
          TR4W_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          TR4W_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # `|| true` is deliberate and predates signing: build-unix.sh does
          # not stop at the first failing stage, and the known DX-cluster
          # timing failure must not withhold the artifacts.
          #
          # IT MUST NOT SWALLOW A SIGNING FAILURE, though, and a signing
          # failure is not "one stage red among several" -- it is the whole
          # reason this job can be trusted. So the run is teed and the
          # signer's own marker is checked for explicitly, which fails this
          # job LOUDLY (and, because the job is continue-on-error and outside
          # the release job's needs:, without withholding the Windows
          # installer).
          sh tr4w/build/build-unix.sh 2>&1 | tee "$RUNNER_TEMP/build-unix.log" || true
          if grep -q 'SIGNING FAILED' "$RUNNER_TEMP/build-unix.log"; then
            echo "::error::macOS signing or notarization failed -- no artifact was produced. The notarytool log, if Apple returned one, is in the step output above."
            exit 1
          fi

      - name: Remove the notary API key
        if: always()
        shell: bash
        run: |
          # ALWAYS, including on a cancelled or failed run. The glob also
          # sweeps keys from earlier attempts, because the runners are treated
          # as a temp folder and a private key is the last thing that should
          # be left lying in one.
          rm -f "$RUNNER_TEMP"/tr4w-notary-*.p8 || true
          rm -f "$RUNNER_TEMP"/build-unix.log || true
          left=$(ls "$RUNNER_TEMP"/tr4w-notary-*.p8 2>/dev/null | wc -l | tr -d ' ')
          echo "notary key material remaining in RUNNER_TEMP: $left"

      - name: Locate the disk image and the tarball
        id: artifact
        shell: bash
        run: |
          set -e
          v="${{ needs.build.outputs.version }}"
          base="build-out/dist/tr4w-$v-aarch64-darwin"

          # BOTH, OR NEITHER -- AND THAT IS NOW A REAL INVARIANT rather than a
          # preference. With TR4W_MAC_SIGN=1 the packaging stage signs and
          # notarizes the staged bundle BEFORE it rolls either archive, and
          # bails without producing either if any of it is rejected. So a
          # half-present pair means something unexpected happened, and
          # shipping the half that exists would mean shipping an artifact that
          # skipped a gate.
          #
          # This used to accept "at least one" and warn. That was right when
          # both were unsigned and interchangeable; it is wrong now, because
          # the two are verified separately (the image by spctl -t open, the
          # app by spctl -t exec).
          missing=''
          [ -f "$base.dmg" ]    || missing="$missing $base.dmg"
          [ -f "$base.tar.gz" ] || missing="$missing $base.tar.gz"
          if [ -n "$missing" ]; then
            echo "::error::macOS artifact(s) missing:$missing -- nothing is attached to this release. A signed pair is produced together or not at all."
            ls -la build-out/dist 2>/dev/null || true
            exit 1
          fi
          for f in "$base.dmg" "$base.tar.gz"; do
            echo "found $f ($(stat -f%z "$f") bytes)"
          done

          # THE LAST GATE, ON THE FILES THAT ARE ACTUALLY GOING TO BE
          # UPLOADED. Everything before this validated things in the staging
          # directory; this asks the same questions of the artifacts
          # themselves, so a packaging mistake between the two cannot pass.
          xcrun stapler validate "$base.dmg"
          spctl --assess -vvv -t open --context context:primary-signature "$base.dmg"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tr4w-macos-${{ needs.build.outputs.version }}
          # Both, and if-no-files-found stays 'error': the step above has
          # already proved at least one exists, so an empty upload here would
          # mean the path glob is wrong rather than the build being empty.
          path: |
            ${{ steps.artifact.outputs.base }}.dmg
            ${{ steps.artifact.outputs.base }}.tar.gz
          retention-days: 90
          if-no-files-found: error

  # =================================================================
  # VirusTotal scan. Pulls the installer artifact from the build job, uploads
  # it to VT, polls for completion, builds a Markdown report and uploads it as
  # a separate artifact for the release job to attach.
  #
  # Fails the job if the installer hits VT_MALICIOUS_THRESHOLD, which in turn
  # blocks the release job (release `needs:` this one).
  # =================================================================
  virustotal-scan:
    name: VirusTotal Scan
    needs: build
    runs-on: [self-hosted, win-ci]
    if: >-
      always()
      && needs.build.result == 'success'
      && !(github.event_name == 'workflow_dispatch' && inputs.skip_virustotal == true)

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tr4w-installer-${{ needs.build.outputs.version }}
          path: installers

      - name: Scan installer with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY }}
        shell: powershell
        run: |
          # The scan logic lives in a standalone, self-testable script (run it
          # with -SelfTest to validate the parse/report logic without the API).
          # It is runtime-agnostic -- curl.exe upload, no -Form -- so this step
          # and any local pre-flight share one file. The API key travels via the
          # VT_API_KEY env var above, never on the command line.
          & '${{ github.workspace }}\.github\scripts\Invoke-VirusTotalScan.ps1' `
            -InstallerDir 'installers' `
            -ReportPath   'virustotal-report.md' `
            -Threshold    ([int]'${{ env.VT_MALICIOUS_THRESHOLD }}') `
            -RefName      '${{ github.ref_name }}' `
            -CommitSha    '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VT report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virustotal-report-${{ needs.build.outputs.version }}
          path: virustotal-report.md
          retention-days: 90

  # =================================================================
  # Release -- only fires on tag push. Pulls installer + VT report and creates
  # a DRAFT release with both attached. workflow_dispatch runs intentionally
  # do not create a release.
  # =================================================================
  release:
    name: Create draft GitHub Release
    needs: [build, virustotal-scan]
    runs-on: [self-hosted, win-ci]
    if: github.event_name == 'push'

    steps:
      # Checked out with the DEFAULT shallow fetch: actions/checkout then
      # fetches only the triggering ref and never pulls refs/heads/*. That
      # matters on this runner (case-insensitive NTFS, 'files' ref backend):
      # two branch names differing only in case cannot both exist on disk, and
      # a previous `fetch-depth: 0` -- which fetches EVERY head -- aborted the
      # whole release job on exactly that collision. The notes step needs TAGS
      # and history for `git describe`, not branch heads, so the next step
      # fetches tags explicitly. Checked out first so its clean step does not
      # wipe the artifacts downloaded below.
      - name: Checkout source at the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch tags + history for the changelog range
        shell: powershell
        run: |
          # ONLY refs/tags/* (never refs/heads/*), so a case-only branch-name
          # collision can never break the release again. A very large --depth
          # fully deepens history whether the repo is currently shallow or
          # already complete -- unlike --unshallow, which errors ("does not make
          # sense") once a prior fetch has completed the repo. git describe needs
          # the ancestry from this tag back to the previous one, and that tag's
          # ref itself, both of which this provides.
          git fetch --prune --no-tags --depth=2147483647 origin "+refs/tags/*:refs/tags/*"
          if ($LASTEXITCODE -ne 0) { throw "Tag fetch failed with exit code $LASTEXITCODE" }

      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tr4w-installer-${{ needs.build.outputs.version }}
          path: release-files

      - name: Download VT report artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: virustotal-report-${{ needs.build.outputs.version }}
          path: release-files

      # THE UNIX ARTIFACTS ARE OPTIONAL BY DESIGN. Their jobs are
      # continue-on-error and are deliberately absent from this job's `needs:`
      # (NY4I, 2026-09-17: a Unix failure must not withhold the Windows
      # installer), so the artifact may simply not exist. continue-on-error
      # here is what turns "absent" into "attach the rest" rather than into a
      # failed release.
      - name: Download Linux artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tr4w-linux-${{ needs.build.outputs.version }}
          path: release-files

      - name: Download Linux AppImage (optional)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tr4w-linux-appimage-${{ needs.build.outputs.version }}
          path: release-files

      - name: Download macOS artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tr4w-macos-${{ needs.build.outputs.version }}
          path: release-files

      - name: List release files
        shell: powershell
        run: Get-ChildItem -LiteralPath release-files | Format-Table Name, Length, LastWriteTime

      # Generate the changelog body against the REAL previous tag. GitHub's
      # built-in generate_release_notes auto-detects the previous tag via semver
      # and skips '-all' tags (they parse as a prerelease), which once made
      # v4.148.4 diff against v4.148.2 and re-list everything already shipped.
      # git describe walks history instead, so tag spellings do not matter.
      - name: Generate release notes (scoped to the real previous tag)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $prev = (& git describe --tags --abbrev=0 "$tag^" 2>$null)
          if ($LASTEXITCODE -ne 0) { $prev = $null }
          $req = @{ tag_name = $tag }
          if ($prev) { Write-Host "Previous tag (git ancestry): $prev"; $req.previous_tag_name = $prev }
          else { Write-Host "No previous tag found; GitHub will auto-detect the range." }
          [System.IO.File]::WriteAllText("$PWD\notes-request.json", ($req | ConvertTo-Json -Compress), (New-Object System.Text.UTF8Encoding($false)))
          $resp = & curl.exe -sS -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -d "@notes-request.json"
          $body = ($resp | ConvertFrom-Json).body
          if (-not $body) { throw "generate-notes returned an empty body. Response: $resp" }
          [System.IO.File]::WriteAllText("$PWD\release-notes.md", $body, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "--- release notes (previous tag: $prev) ---"
          Write-Host $body

      # THE MAC NOTE, NOW THAT THE ARTIFACTS ARE SIGNED AND NOTARIZED.
      #
      # This step used to append an "it is NOT signed, run xattr -dr" note.
      # That instruction is now FALSE and actively harmful to leave in place:
      # it would tell an operator to strip quarantine from an artifact that
      # does not need it, and it would say "unsigned" about something Apple
      # notarized.
      #
      # THE PRESENCE OF A MAC ARTIFACT IS THE EVIDENCE, which is what makes
      # this safe to state unconditionally. The macOS job runs with
      # TR4W_MAC_SIGN=1, and the packaging stage under that flag signs,
      # notarizes and staples BEFORE it rolls either archive and produces
      # NEITHER if any of it is rejected. There is no path that yields an
      # unsigned .dmg or .tar.gz -- an unsigned build is an absent build. So
      # "a darwin artifact is in release-files" and "it was notarized" are the
      # same fact, and this note cannot get ahead of reality.
      #
      # Appended to the generated notes rather than replacing them, and only
      # when a Darwin tarball actually made it into release-files.
      - name: Note the signed macOS artifacts
        shell: powershell
        run: |
          $mac = Get-ChildItem -Path release-files -Filter 'tr4w-*-aarch64-darwin.tar.gz' -File -ErrorAction SilentlyContinue
          if (-not $mac) {
            Write-Host 'No macOS artifact in this release -- nothing to note.'
            exit 0
          }
          $note = @(
            '',
            '---',
            '',
            '**macOS: signed with a Developer ID and notarized by Apple.**',
            'The notarization ticket is stapled to both downloads, so Gatekeeper can',
            'verify them without a network connection. There is no quarantine step to',
            'run and no *damaged* dialog to work around.',
            '',
            'Two downloads are offered and they carry the same build:',
            '',
            '- `.dmg` -- the disk image. Open it and drag `TR4W.app` to Applications.',
            '- `.tar.gz` -- the same payload as a tarball, stapled app included.',
            '',
            '`tr4wserver` ships beside the application in both and is signed as well.',
            '',
            'macOS builds remain BUILDS: the application is signed and notarized, which',
            'says it is from us and unmodified -- not that it has been exercised on the',
            'air. See the README for what has and has not been run.',
            ''
          ) -join "`n"
          Add-Content -Path release-notes.md -Value $note -Encoding utf8
          Write-Host 'Appended the signed-artifact note to release-notes.md'

      # THE LINUX AppImage NOTE.
      #
      # Written only when an AppImage actually reached release-files, for the
      # same reason the macOS note is conditional: a note about a download that
      # is not there is worse than no note.
      #
      # EVERYTHING IN IT IS A MEASURED FACT, and the two caveats are the two
      # things a downloader actually hits. The glibc floor is 2.38 and NOT the
      # 2.34 the executable itself needs -- measured with objdump -T over the
      # 38 bundled libraries on 2026-09-20: thirteen of them, glib, pango,
      # cairo, harfbuzz, fontconfig, sqlite3 and OpenSSL among them, reference
      # GLIBC_2.38. An AppImage carries everything EXCEPT the C library, so the
      # bundle's floor is the AppImage's floor, and quoting the executable's
      # would promise it runs on distributions where it cannot start.
      #
      # THE HONEST GAPS ARE STATED, not fixed here: HamLib is not in the
      # bundle, and the icon is a generated placeholder.
      - name: Note the Linux AppImage
        shell: powershell
        run: |
          $img = Get-ChildItem -Path release-files -Filter 'TR4W-*-x86_64.AppImage' -File -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $img) {
            Write-Host 'No AppImage in this release -- nothing to note.'
            exit 0
          }
          $note = @(
            '',
            '---',
            '',
            '**Linux: the AppImage is one file. Download it, make it executable, run it.**',
            'Nothing is installed and nothing is unpacked. GTK 2 travels inside it, so',
            'there is no `apt install` to do first -- which is the whole reason it exists.',
            '',
            '```',
            "chmod +x $($img.Name)",
            "./$($img.Name)",
            '```',
            '',
            'Two things can stop it starting, and neither is obvious from the message you get:',
            '',
            '**It needs a recent distribution.** It is built on Ubuntu 24.04, and the system',
            'C library is the one piece that can never travel inside an AppImage. It runs on',
            'Ubuntu 24.04 and 23.10, Debian 13, and Fedora 39 or newer. It does **not** run on',
            'Ubuntu 22.04 LTS, Ubuntu 20.04, Debian 12 or RHEL 9 -- on those it stops at once',
            'complaining about `GLIBC_2.38`. On an older machine use the `.tar.gz` instead,',
            'which goes back further but expects GTK 2 to be installed already.',
            '',
            '**It may need FUSE, and many current distributions no longer ship it.** An',
            'AppImage normally mounts itself, which wants libfuse2. If it refuses to start',
            'with a message about FUSE or about mounting, run it this way instead -- it',
            'unpacks to a temporary directory and needs nothing installed:',
            '',
            '```',
            "./$($img.Name) --appimage-extract-and-run",
            '```',
            '',
            'Two things are knowingly unfinished in this build:',
            '',
            '- **Radios driven through HamLib will not work from the AppImage** unless',
            '  `libhamlib` is already installed on the machine -- it is not bundled, and',
            '  that combination has not been tested. Radios TR4W drives directly (Elecraft,',
            '  Icom, Kenwood, Yaesu, Flex, TCI) are unaffected.',
            '- **The icon is a placeholder**, a plain blue square. Real artwork is pending.',
            '',
            'Linux builds remain BUILDS. The AppImage has been launched on the machine that',
            'made it and on nothing else; see the README for what has and has not been run.',
            ''
          ) -join "`n"
          Add-Content -Path release-notes.md -Value $note -Encoding utf8
          Write-Host 'Appended the AppImage note to release-notes.md'

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: TR4W v${{ needs.build.outputs.version }}
          # Draft so the notes can be reviewed and manual context added (radio
          # support, breaking changes) before publishing. Promote via the UI.
          draft: true
          body_path: release-notes.md
          files: |
            release-files/tr4w_setup_*.exe
            release-files/virustotal-report.md
            release-files/tr4w-*-x86_64-linux.tar.gz
            release-files/TR4W-*-x86_64.AppImage
            release-files/tr4w-*-aarch64-darwin.dmg
            release-files/tr4w-*-aarch64-darwin.tar.gz
          # FALSE, AND IT HAS TO BE. The Linux and macOS jobs are
          # continue-on-error and are not in this job's `needs:` -- a Unix
          # failure must not withhold the Windows installer (NY4I,
          # 2026-09-17). With `true`, a missing Unix tarball would fail the
          # release step and do exactly that by the back door.
          #
          # The Windows installer is still guaranteed: this job `needs:` the
          # build and virustotal jobs, so it does not run at all unless the
          # installer exists.
          fail_on_unmatched_files: false
